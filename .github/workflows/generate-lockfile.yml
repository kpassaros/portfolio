name: Generate reproducible lockfile

'on':
  push:
    branches:
      - 'chore/repository-cleanup-phase-2'
    paths:
      - 'package.json'
      - '.github/workflows/generate-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    name: Generate and commit package-lock
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: '${{ github.ref_name }}'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit package-lock
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: gera lockfile reproduzível"
          git push
