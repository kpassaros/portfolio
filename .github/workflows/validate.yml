name: Validate Astro candidate

'on':
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Audit, check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit project structure
        run: npm run audit

      - name: Check Astro project
        run: npm run check

      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
          SITE_URL: 'https://${{ github.repository_owner }}.github.io'
