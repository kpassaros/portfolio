<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documentation Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#17202a;font:14px Arial;padding:18px}.app{display:grid;grid-template-columns:210px 1fr;min-height:650px;border:1px solid #cfd9df;border-radius:12px;overflow:hidden;background:white}.side{padding:22px;background:#15232e;color:white}.side h1{font-size:18px}.side button{display:block;width:100%;padding:10px;border:0;background:none;color:#aebdca;text-align:left;cursor:pointer}.side button.active,.side button:hover{color:#75b7ff;background:#203442;border-radius:6px}.main{min-width:0;padding:24px}.search{width:100%;padding:13px;border:1px solid #cfd9df;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.card{border:1px solid #d7e0e8;border-radius:9px;padding:18px;text-align:left;background:white;cursor:pointer}.card:hover{border-color:#2474d2;transform:translateY(-2px)}.tag{color:#2474d2;font-size:11px;font-weight:bold}p{color:#61707d}.detail{margin-top:16px;padding:18px;border-left:3px solid #2474d2;background:#f3f7fb}.detail h2{margin:0 0 8px}@media(max-width:650px){.app{grid-template-columns:1fr}.side{padding:12px}.side h1{display:none}.side nav{display:flex;overflow:auto}.side button{white-space:nowrap}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><h1>Data & BI Docs</h1><nav id="filters"><button class="active" data-kind="Todos">Visão geral</button><button data-kind="Dicionário">Dicionário</button><button data-kind="KPI">KPIs</button><button data-kind="Linhagem">Linhagem</button><button data-kind="Arquitetura">Arquitetura</button></nav></aside><main class="main"><input id="search" class="search" placeholder="Buscar documento, KPI ou campo..."><div class="grid" id="grid"></div><div class="detail" id="detail"><h2>Selecione um item</h2><p>Explore definições, fórmulas, origem, periodicidade e responsáveis fictícios.</p></div></main></div><script>const docs=[{kind:'Dicionário',title:'Fato_Movimentações',text:'Granularidade: uma transação financeira. Chave: ID da movimentação. Campos críticos: data, natureza, valor e status.'},{kind:'KPI',title:'Saldo disponível',text:'Entradas menos saídas no período. Atualização diária. Fonte demonstrativa: fluxo_caixa.csv.'},{kind:'KPI',title:'Taxa de atraso',text:'Títulos vencidos divididos pelo total de títulos com vencimento no período.'},{kind:'Linhagem',title:'Origem → Power Query → Modelo',text:'CSV sintético passa por tipagem, qualidade e regras antes de alimentar o modelo dimensional.'},{kind:'Arquitetura',title:'CashFlow Intelligence',text:'Fato financeira conectada às dimensões Data, Categoria, Conta, Unidade e Status.'},{kind:'Dicionário',title:'Dim_Categoria',text:'Classificação controlada de entradas e saídas para análise gerencial.'}];let kind='Todos';const q=s=>document.querySelector(s);function draw(){const term=q('#search').value.toLowerCase(),rows=docs.filter(x=>(kind==='Todos'||x.kind===kind)&&(x.title+' '+x.text).toLowerCase().includes(term));q('#grid').innerHTML=rows.map((x,i)=>`<button class="card" data-i="${docs.indexOf(x)}"><span class="tag">${x.kind.toUpperCase()}</span><h2>${x.title}</h2><p>${x.text.slice(0,90)}...</p></button>`).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const x=docs[b.dataset.i];q('#detail').innerHTML=`<span class="tag">${x.kind.toUpperCase()}</span><h2>${x.title}</h2><p>${x.text}</p>`})}q('#search').oninput=draw;document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));draw()});draw();</script></body></html>
