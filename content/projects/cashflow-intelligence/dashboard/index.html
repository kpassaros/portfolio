<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CashFlow Dashboard</title><style>:root{--ink:#171918;--muted:#68737c;--line:#dbe4ed;--blue:#2474d2;--paper:#f3f6f8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif;padding:24px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}h1{font-size:25px;margin:4px 0}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--blue);font-weight:700}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi,.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:16px}.kpi small{display:block;color:var(--muted);font-size:10px}.kpi b{display:block;font-size:20px;margin-top:8px}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:14px;margin-top:14px}.panel h2{font-size:16px;margin:0 0 14px}.chart{height:260px;display:flex;align-items:end;gap:6px;border-bottom:1px solid var(--line);padding-top:20px}.group{flex:1;height:100%;display:flex;align-items:end;gap:2px}.bar{flex:1;border-radius:3px 3px 0 0}.in{background:#74a9d8}.out{background:#e3a25f}.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin-top:10px}.dot{width:8px;height:8px;display:inline-block;border-radius:2px;margin-right:5px}.cat{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;margin:10px 0}.track{height:8px;background:#edf1f4;border-radius:5px}.fill{height:100%;background:var(--blue);border-radius:5px}.cat b{text-align:right;font-size:11px}@media(max-width:760px){body{padding:14px}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.chart{height:220px}.head{display:block}}</style></head><body><header class="head"><div><span class="eyebrow">DASHBOARD DEMONSTRATIVO</span><h1>CashFlow Intelligence</h1></div><span id="period"></span></header><section id="kpis" class="kpis"></section><section class="grid"><article class="panel"><h2>Entradas e saídas mensais</h2><div id="chart" class="chart"></div><div class="legend"><span><i class="dot in"></i>Entradas</span><span><i class="dot out"></i>Saídas</span></div></article><article class="panel"><h2>Saídas por categoria</h2><div id="cats"></div></article></section><script>(async()=>{const d=await fetch('data.json').then(r=>r.json()),s=d.summary,m=d.months.slice(-12),money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:'compact',maximumFractionDigits:1}).format(v);document.querySelector('#period').textContent=s.period;document.querySelector('#kpis').innerHTML=[['Entradas',money(s.entradas)],['Saídas',money(s.saidas)],['Saldo',money(s.saldo)],['Vencido',money(s.valor_vencido)],['Atraso',s.taxa_atraso+'%']].map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');const max=Math.max(...m.flatMap(x=>[x.entradas,x.saidas]));document.querySelector('#chart').innerHTML=m.map(x=>`<div class="group" title="${x.mes}: entradas ${money(x.entradas)}, saídas ${money(x.saidas)}"><i class="bar in" style="height:${x.entradas/max*100}%"></i><i class="bar out" style="height:${x.saidas/max*100}%"></i></div>`).join('');const cm=Math.max(...d.categories.map(x=>x.valor));document.querySelector('#cats').innerHTML=d.categories.map(x=>`<div class="cat"><span>${x.categoria}</span><div class="track"><div class="fill" style="width:${x.valor/cm*100}%"></div></div><b>${money(x.valor)}</b></div>`).join('')})()</script></body></html>
